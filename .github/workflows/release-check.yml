name: Release Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  release-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tracked release files
        shell: pwsh
        run: ./scripts/validate-release.ps1 -SkipGodotTests
